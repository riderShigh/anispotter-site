<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AniSpotter</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --link: #0a5fb0;
    --border: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #eaeaea;
      --muted: #a3a3a3;
      --link: #6db4ff;
      --border: #2c2f36;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
    font-size: 17px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main {
    max-width: 680px;
    text-align: center;
  }
  h1 {
    font-size: 2.2rem;
    margin: 0 0 0.5rem;
  }
  p.tagline {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 2rem;
  }
  nav {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2.5rem;
  }
  a {
    color: var(--link);
    text-decoration: underline;
  }
  a:hover {
    text-decoration: none;
  }
  footer {
    color: var(--muted);
    font-size: 0.9rem;
  }
  footer a {
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>AniSpotter</h1>
  <p class="tagline">Identify wildlife, log your sightings, and explore a community spotting map.</p>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </nav>
  <footer>
    <p>Support: <a href="mailto:support@anispotter.com">support@anispotter.com</a></p>
  </footer>
</main>
</body>
</html>
